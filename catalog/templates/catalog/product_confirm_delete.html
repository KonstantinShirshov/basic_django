{% extends 'catalog/base.html' %}
{% block title %}Создание и редактирование статьи{% endblock %}

{% block content %}
<div class="container">
    <div class="row text-center">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="body">
                        <p class="card-text text-start">Дейстительно хотите удалить "{{ product.name }}"</p>
                        <div class="card-body">
                            {% csrf_token %}
                        </div>
                        <button type="submit" class="btn btn-primary mb-3">Удалить</button>
                        <a class="btn btn-primary mb-3" href="{% url 'blog:articles_list' %}" role="button">Отменить</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% include 'catalog/footer.html' %}
{% endblock %}
